<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Portal · Drug Disco Lab</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Lab members only.">
<meta name="theme-color" content="#0a0914">
<meta property="og:title" content="Lab Portal · Drug Disco Lab">
<meta property="og:description" content="Lab members only.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&family=Mitr:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0914; --panel:#16121f; --panel2:#221d33; --line:#3e3660;
  --ink:#f4effd; --mute:#9d94bb; --dim:#6c6490;
  --mint:#a6efcd; --lav:#c8b4ff; --pink:#ffadc8; --sky:#9fd6ff; --peach:#ffcf9e; --butter:#fff0a0;
  --head:'Press Start 2P','Mitr',monospace;
  --body:'Pixelify Sans','Mitr',system-ui,sans-serif;
  --px:3px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{overflow-x:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
@keyframes blink{50%{opacity:0}}
@keyframes nudge{50%{transform:translateX(3px)}}

/* pixel frame = notched corners */
.pf{--bc:var(--line);box-shadow:0 calc(-1*var(--px)) 0 0 var(--bc),0 var(--px) 0 0 var(--bc),calc(-1*var(--px)) 0 0 0 var(--bc),var(--px) 0 0 0 var(--bc)}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.deco{position:absolute;top:0;left:0;right:0;height:420px;overflow:hidden;z-index:0;pointer-events:none}
#giant{position:absolute;top:-30px;right:-70px;width:340px;height:340px;opacity:.5}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 20px 26px}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;margin:3px;padding:9px 12px;background:rgba(22,18,31,.75);font:8px/1.6 var(--head);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.hud>span{white-space:nowrap}
.hud .blip{width:6px;height:6px;flex:none;background:var(--mint);animation:blink 1s steps(1) infinite}
.hud .right{margin-left:auto;color:var(--mint);white-space:nowrap}
.hud .sep{color:var(--dim)}

/* Hero */
.hero{display:flex;align-items:center;gap:22px;margin:26px 3px 22px}
#portal{width:108px;height:108px;flex:none}
.kicker{margin:0 0 12px;font:10px var(--head);letter-spacing:.12em;color:var(--pink)}
h1{margin:0;font:clamp(22px,4.2vw,40px)/1.15 var(--head);color:var(--ink);text-shadow:3px 3px 0 #3b2f7a,6px 6px 0 rgba(0,0,0,.55)}
.sub{margin:12px 0 0;font-size:18px;color:var(--mute)}
.sub b{color:var(--butter);font-weight:600}

/* Search */
.search{display:flex;align-items:center;gap:12px;margin:0 3px 26px;padding:11px 14px;background:var(--panel)}
.search:focus-within{--bc:var(--mint)}
.search .prompt{font:12px var(--head);color:var(--mint);animation:blink 1.1s steps(1) infinite}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:20px var(--body);caret-color:var(--mint)}
.search input::placeholder{color:var(--dim)}
kbd{font:9px var(--head);color:var(--mute);background:var(--panel2);padding:5px 6px}

/* Destinations */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:24px;padding:3px}
.dest{--c:var(--mint);position:relative;display:flex;flex-direction:column;padding:14px 16px;background:rgba(22,18,31,.9);color:inherit;text-decoration:none;cursor:pointer;outline:none;transition:transform .1s steps(2)}
.dest:hover,.dest:focus-visible{--bc:var(--c);transform:translate(-3px,-3px);filter:drop-shadow(6px 6px 0 rgba(0,0,0,.75))}
.dest:active{transform:none;filter:none}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font:8px var(--head);letter-spacing:.08em;color:var(--dim)}
.d-top .l{display:flex;align-items:center;gap:8px}
.key{color:var(--ink);background:var(--panel2);padding:4px 5px}
.status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status i{display:inline-block;width:6px;height:6px;background:currentColor}
.st-online{color:var(--mint)} .st-online i{animation:blink 1.2s steps(1) infinite}
.st-beta{color:var(--sky)} .st-repair{color:var(--peach)} .st-soon,.st-nosignal{color:var(--dim)}
.hole{display:block;width:144px;height:144px;margin:2px auto 0}
.d-name{display:flex;align-items:center;gap:10px;margin:0;font:13px/1.45 var(--head);color:var(--c)}
.d-name canvas{flex:none}
.d-desc{flex:1;margin:10px 0 14px;font-size:17px;line-height:1.35;color:var(--mute)}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:13px;background:linear-gradient(90deg,var(--line) 50%,transparent 0) top left/12px 3px repeat-x}
.coord{font:8px var(--head);color:var(--dim)}
.go{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;font:10px var(--head);color:#120f1c;background:var(--c);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.dest:hover .go .ar,.dest:focus-visible .go .ar{animation:nudge .4s steps(2) infinite}
.dest.uncharted{--c:var(--dim);cursor:default;background:rgba(22,18,31,.55)}
.dest.uncharted:hover{transform:none;filter:none;--bc:var(--line)}
.dest.uncharted .go{background:var(--panel2);color:var(--mute)}

.empty{padding:30px 10px;text-align:center;font:10px/2 var(--head);color:var(--mute)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;margin:30px 3px 0;font:8px/1.9 var(--head);letter-spacing:.06em;color:var(--dim)}
footer b{font-weight:400;color:var(--mute)}

/* Warp */
#warp{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#05040a}
#warp.on{display:flex}
#warpc{position:absolute;inset:0;width:100%;height:100%}
.warp-txt{position:relative;padding:10px 16px;background:rgba(5,4,10,.78);text-align:center;font:12px/2.2 var(--head);color:var(--ink);text-shadow:3px 3px 0 #000}
.warp-txt span{color:var(--wc,var(--mint))}

#toast{position:fixed;left:50%;bottom:18px;z-index:60;max-width:calc(100% - 32px);padding:12px 16px;background:var(--panel2);--bc:var(--peach);font:9px/1.9 var(--head);color:var(--ink);transform:translate(-50%,calc(100% + 40px));visibility:hidden;transition:transform .15s steps(3),visibility 0s .15s}
#toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .15s steps(3)}
#toast a{color:var(--mint)}

/* Lock screen */
body.locked .wrap{display:none}
#lock{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
body.locked #lock{display:flex}
.lock-box{width:100%;max-width:440px;padding:26px 24px 22px;background:rgba(22,18,31,.92);text-align:center}
#lockPortal{width:96px;height:96px;display:block;margin:0 auto 18px}
.lock-box h2{margin:0 0 12px;font:clamp(15px,4vw,20px)/1.4 var(--head);color:var(--ink);text-shadow:3px 3px 0 #3b2f7a}
.lock-sub{margin:0 0 20px;font-size:17px;color:var(--mute)}
.lock-box form{display:flex;flex-direction:column;gap:14px}
.lock-box .search{margin:0}
.lock-box .search input{font:16px var(--head);letter-spacing:.15em}
.remember{display:flex;align-items:center;justify-content:center;gap:10px;font:8px var(--head);color:var(--mute);cursor:pointer}
.remember input{appearance:none;width:14px;height:14px;margin:0;background:var(--panel2);box-shadow:0 0 0 3px var(--line);cursor:pointer}
.remember input:checked{background:var(--mint)}
.unlock{align-self:center;border:0;cursor:pointer;font:11px var(--head);padding:11px 16px;background:var(--lav);color:#120f1c;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.unlock:hover,.unlock:focus-visible{background:var(--mint);outline:none}
.unlock:disabled{background:var(--panel2);color:var(--mute);cursor:wait}
.lock-msg{min-height:1.8em;margin:14px 0 0;font:9px/1.8 var(--head);color:var(--mute)}
.lock-msg.bad{color:#ff8a6a}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .3s steps(4)}
.lockbtn{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;color:var(--mute)}
.lockbtn:hover,.lockbtn:focus-visible{color:var(--pink);outline:none}

@media (max-width:600px){
  .wrap{padding:12px 16px 22px}
  .hud .hide-s{display:none}
  .hud{gap:10px;padding:9px 10px}
  .hero{gap:14px;margin:20px 3px 18px}
  #portal{width:72px;height:72px}
  .kicker{font-size:8px}
  .sub{font-size:16px}
  #giant{width:220px;height:220px;right:-90px;top:-20px;opacity:.3}
  .grid{grid-template-columns:1fr;gap:20px}
  .hole{width:120px;height:120px}
}
@media (hover:none){.key,.keys-hint,kbd{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="locked">
<canvas id="sky" aria-hidden="true"></canvas>
<div class="deco" aria-hidden="true"><canvas id="giant" width="80" height="80"></canvas></div>

<div id="lock" role="dialog" aria-labelledby="lockTitle">
  <div class="lock-box pf" id="lockBox">
    <canvas id="lockPortal" width="36" height="36" aria-hidden="true"></canvas>

    <h2 id="lockTitle">RESTRICTED SECTOR</h2>
    <p class="lock-sub">Lab members only. Enter the access code to open the portal.</p>
    <form id="lockForm" autocomplete="on">
      <input type="text" name="username" value="lab-portal" autocomplete="username" hidden>
      <label class="search pf">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input id="pw" type="password" placeholder="ACCESS CODE" autocomplete="current-password" aria-label="Access code" required>
      </label>
      <label class="remember"><input type="checkbox" id="remember" checked> REMEMBER THIS DEVICE</label>
      <button class="unlock" id="unlockBtn" type="submit">UNLOCK ▶</button>

    <p class="lock-msg" id="lockMsg" role="status"></p>
  </div>
</div>

<main class="wrap">
  <div class="hud pf">
    <span class="blip"></span>
    <span>PORTAL STATION <span id="station"></span></span>
    <span class="sep hide-s">·</span>
    <span id="stardate" class="hide-s"></span>
    <span class="right">SYSTEMS ONLINE</span>
  </div>

  <header class="hero">
    <canvas id="portal" width="36" height="36" aria-hidden="true"></canvas>
    <div>
      <p class="kicker" id="labname"></p>
      <h1>LAB PORTAL</h1>
      <p class="sub">Choose a destination and hit <b>WARP</b> to launch the app.</p>
    </div>
  </header>

  <label class="search pf">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <input id="q" type="search" placeholder="Search destinations…" autocomplete="off" aria-label="Search apps">
    <kbd>/</kbd>

  <section class="grid" id="grid" aria-label="Lab apps"></section>
  <p class="empty" id="empty" hidden>NO DESTINATION FOUND.<br>TRY ANOTHER COORDINATE.</p>

  <footer>
    <span id="note"></span>
    <span><span class="keys-hint"><b>1–9</b> WARP &nbsp;·&nbsp; <b>/</b> SEARCH &nbsp;·&nbsp; </span><button class="lockbtn" id="lockBtn" type="button">⏏ LOCK</button></span>
  </footer>
</main>

<div id="warp" aria-live="polite"><canvas id="warpc"></canvas><div class="warp-txt"><span id="warpTop" style="color:inherit">ENTERING WORMHOLE</span><br>▶ <span id="warpDest"></span></div></div>

function iconCanvas(name, color, scale = 3) {
  const bm = ICONS[name] || ICONS.rocket, h = bm.length, w = bm[0].length;
  const c = document.createElement('canvas'); c.width = w + 1; c.height = h + 1;
  c.style.width = (w + 1) * scale + 'px'; c.style.height = (h + 1) * scale + 'px';
  const x = c.getContext('2d');
  for (const [dx, dy, col] of [[1,1,'rgba(0,0,0,.55)'],[0,0,color]]) {
    x.fillStyle = col;
    bm.forEach((row, y) => [...row].forEach((ch, i) => ch === 'X' && x.fillRect(i + dx, y + dy, 1, 1)));
  }
  c.setAttribute('aria-hidden', 'true');
  return c;

/* ---------- Pixel planet renderer ---------- */
function renderPlanet(ctx, S, rgb, t, o) {
  const img = ctx.createImageData(S, S), d = img.data, c = (S - 1) / 2, R = o.r;
  const rx = R * 1.8, ry = R * .42, ct = Math.cos(-.32), st = Math.sin(-.32);

  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - c, dy = y - c, rr = (dx*dx + dy*dy) / (R*R), inP = rr <= 1;
    let col = -1;

/* ---------- Pixel wormhole renderer ----------
   Classic tunnel mapping: depth = k / radius. Rings + spiral arms scroll
   toward the viewer; hash-picked "lanes" carry hyperspace streaks. */
const WHITE = [255,255,255];
const frac = v => v - Math.floor(v);
const hash = n => frac(Math.sin(n * 127.1 + 11.7) * 43758.5453);
function renderWormhole(img, W, H, rgb, o) {
  const d = img.data, cols = rgb.concat([WHITE]);
  const R = o.R, Rn = o.R || o.Rn, rim = o.R ? 3.5 : 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = (y*W + x) * 4;
    const dx = x - o.cx, dy = y - o.cy, dist = Math.hypot(dx, dy);
    let col = -1;
    if (R && dist > R + rim) { d[k+3] = 0; continue; }
    if (R && dist > R) {                       // event-horizon rim
      const a = Math.atan2(dy, dx) / (Math.PI*2);
      const e = (dist - R) / rim, lit = frac(a*6 - o.spin*3) < .5;
      col = e < .35 ? 4 : (e < .7 ? (lit ? 3 : 2) : (BAYER[y&3][x&3] < -.1 ? 1 : -1));
    } else {                                   // tunnel interior
      const rn = dist / Rn, bend = (1 - rn) * (1 - rn);
      const bx = dx - o.bx * bend, by = dy - o.by * bend;
      const bd = Math.hypot(bx, by), rr = Math.min(1.4, bd / Rn);
      const depth = .3 / (rr + .03);
      const a = Math.atan2(by, bx) / (Math.PI*2) + .5;
      const u = a + depth * .11 + o.spin, v = depth + o.v;
      const arm = frac(u * o.arms + v * .55), ring = frac(v * .8);
      let lum = (1 - Math.min(rr,1)) ** 1.6 * 2.9 + .2 + (arm < .5 ? .45 : -.2) + (ring < .14 ? 1 : 0) + BAYER[y&3][x&3] * .8;
      col = Math.max(0, Math.min(4, Math.round(lum)));
      if (o.streak) {                          // thin 1px hyperspace streaks
        const la = a * o.lanes, lane = Math.floor(la), off = Math.abs(frac(la) - .5) * Math.PI * 2 * bd / o.lanes;
        if (off < .6 && rr > .2 && frac(v * .35 + hash(lane + o.seed)) < .06 * o.streak) col = 5;
      }
      if (rr < .09) col = 5;
    }
    if (col < 0) { d[k+3] = 0; continue; }
    const p = cols[col]; d[k] = p[0]; d[k+1] = p[1]; d[k+2] = p[2]; d[k+3] = 255;
  }
  // matter spiralling in from outside the rim
  if (o.R && o.inflow) for (let i = 0; i < o.inflow; i++) {
    const f = frac(o.v * .12 + i / o.inflow), rad = R + rim + (1 - f) * 7;
    const ang = i * 2.399 + f * 4 + o.spin * 6;
    const px = Math.round(o.cx + Math.cos(ang) * rad), py = Math.round(o.cy + Math.sin(ang) * rad);
    if (px < 0 || py < 0 || px >= W || py >= H) continue;
    const k = (py*W + px) * 4, p = cols[f > .6 ? 5 : 3];
    d[k] = p[0]; d[k+1] = p[1]; d[k+2] = p[2]; d[k+3] = 255;
  }
}

/* ---------- Warp ---------- */
let warping = false;

  if (reduced) { openApp(app); return; }

function runWarp(pal, top, dest, done) {
  warping = true;
  const ov = $('#warp'), wc = $('#warpc'), x = wc.getContext('2d'), SC = 4;
  $('#warpTop').textContent = top; $('#warpDest').textContent = dest;
  ov.style.setProperty('--wc', pal.c); ov.classList.add('on');
  wc.width = Math.ceil(innerWidth / SC); wc.height = Math.ceil(innerHeight / SC);
  const W = wc.width, H = wc.height, cx = W / 2, cy = H / 2;
  const tc = document.createElement('canvas'); tc.width = W; tc.height = H;
  const tx = tc.getContext('2d'), timg = tx.createImageData(W, H);
  const o = { cx, cy, R: 0, Rn: Math.min(W, H) * .55, v: 0, spin: 0, bx: 0, by: 0, arms: 4, lanes: 40, seed: 3, streak: 0 };
  const cols = ['#ffffff', pal.c, '#c8b4ff', '#9fd6ff'];
  const parts = Array.from({ length: 220 }, () => ({ x: Math.random()*2 - 1, y: Math.random()*2 - 1, z: Math.random()*1.1 + .15, c: cols[Math.random()*4 | 0] }));
  const DUR = 1050, t0 = performance.now(); let last = t0, opened = false;
  (function frame(now) {
    const p = Math.min(1, (now - t0) / DUR), dt = Math.min(40, now - last); last = now;
    // 1) wormhole tunnel, fading in and accelerating
    o.v += (.4 + p * p * 9) * dt / 1000 * 1.6; o.spin += dt / 1000 * (.1 + p * .6);
    o.bx = Math.sin(now * .003) * W * .06 * (1 - p); o.by = Math.cos(now * .0024) * H * .06 * (1 - p);
    renderWormhole(timg, W, H, pal.rgb, o); tx.putImageData(timg, 0, 0);
    x.fillStyle = '#05040a'; x.fillRect(0, 0, W, H);
    x.globalAlpha = Math.min(1, p * 2.2); x.drawImage(tc, 0, 0); x.globalAlpha = 1;
    // 2) star streaks jumping past the camera
    const sp = (.004 + p * p * .05) * dt / 16, k = Math.min(W, H) * .5;
    for (const s of parts) {
      s.z -= sp;
      if (s.z <= .03) { s.x = Math.random()*2 - 1; s.y = Math.random()*2 - 1; s.z = 1.2; continue; }
      const z0 = s.z + sp * (3 + p * 10);
      const x0 = cx + s.x / z0 * k, y0 = cy + s.y / z0 * k, x1 = cx + s.x / s.z * k, y1 = cy + s.y / s.z * k;
      const n = Math.min(80, Math.max(Math.abs(x1-x0), Math.abs(y1-y0)) | 0) + 1;
      x.fillStyle = s.c;
      for (let i = 0; i <= n; i++) x.fillRect(Math.round(x0 + (x1-x0)*i/n), Math.round(y0 + (y1-y0)*i/n), 1, 1);
    }
    // 3) white-out at the exit
    if (p > .82) { x.globalAlpha = (p - .82) / .18; x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }
    if (p < 1) requestAnimationFrame(frame);
    else if (!opened) {
      opened = true; done();
      setTimeout(() => { ov.classList.remove('on'); warping = false; holes.forEach(h => h.target = 0); }, 180);
    }
  })(t0);
}

  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - c, dy = y - c, r = Math.hypot(dx, dy); if (r > 17.6) continue;
    let rgb;
    if (r > 15.4) rgb = (dx + dy < -4) ? [200,180,255] : (dx + dy > 6 ? [43,35,80] : [62,54,96]);

/* ---------- Access-code vault ----------
   The app list is AES-256-GCM encrypted with a key derived from the
   access code (PBKDF2-SHA256). Without the code, the page source only
   contains ciphertext — no app names or links. */
const KDF_ITER = 310000, KEY_STORE = 'ddl-portal-key';

  get() { try { return JSON.parse(localStorage.getItem(KEY_STORE)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY_STORE, JSON.stringify(v)); } catch (e) {} },

async function openVault(key) {
  const [, iv, ct] = VAULT.split('.').map(unb64);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt)).apps;
}
const lockMsg = (t, bad) => { const m = $('#lockMsg'); m.textContent = t; m.classList.toggle('bad', !!bad); };
$('#lockLab').textContent = LAB.name;

async function tryRemembered() {
  const saved = store.get();
  if (!saved || !VAULT || saved.salt !== VAULT.split('.')[0]) { if (saved) store.clear(); return false; }
  try {
    const key = await crypto.subtle.importKey('raw', unb64(saved.key), 'AES-GCM', false, ['decrypt']);
    launch(await openVault(key)); return true;
  } catch (e) { store.clear(); return false; }
}

$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw').value, btn = $('#unlockBtn');
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'DECRYPTING…'; lockMsg('CHECKING CODE…');
  try {
    const salt = unb64(VAULT.split('.')[0]);
    const key = await deriveKey(pw, salt);
    const apps = await openVault(key);
    if ($('#remember').checked) store.set({ salt: VAULT.split('.')[0], key: b64(new Uint8Array(await crypto.subtle.exportKey('raw', key))) });
    lockMsg('ACCESS GRANTED.');
    const reveal = () => { launch(apps); $('#pw').value = ''; };
    if (reduced) reveal(); else runWarp(PAL.lav, 'ACCESS GRANTED', 'WELCOME ABOARD', reveal);
  } catch (err) {
    lockMsg('ACCESS DENIED — WRONG CODE.', true);
    const box = $('#lockBox'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    $('#pw').select();
  } finally { btn.disabled = false; btn.textContent = 'UNLOCK ▶'; }
});

$('#lockBtn').addEventListener('click', () => { store.clear(); location.reload(); });

(async () => {
  if (!window.crypto || !crypto.subtle) { lockMsg('OPEN THIS PAGE OVER HTTPS TO UNLOCK.', true); $('#unlockBtn').disabled = true; return; }
  if (!VAULT) { lockMsg('NO VAULT YET — SET AN ACCESS CODE WITH PORTAL-ADMIN.HTML.', true); $('#unlockBtn').disabled = true; return; }
  if (!(await tryRemembered())) $('#pw').focus();
})();
</script>
